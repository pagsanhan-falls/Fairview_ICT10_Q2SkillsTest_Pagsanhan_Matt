<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script><title>ICT 10</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container acts as the white box covering all elements inside body */
        .container {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border: 2px solid #e0e0e0;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: rgb(4, 136, 39);
            margin-top: 0;
            font-size: 24px;
        }

        p {
            margin: 10px 0;
            font-size: 16px;
        }

        #element1 {
            width: 100%;
            padding: 10px 14px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 6px;
            outline: none;
            margin-top: 10px;
            transition: border-color 0.3s ease;
        }

        #element1:focus {
            border-color: rgb(4, 136, 39);
        }

        button {
            background-color: rgb(4, 136, 39);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: rgb(3, 105, 30);
        }

        button:active {
            transform: scale(0.98);
        }

        h3 {
            color: rgb(4, 136, 39);
            margin-top: 25px;
            letter-spacing: 1px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        #output1 {
            border: 5px solid rgb(4, 136, 39);
            box-shadow: 0px 5px 5px rgb(200, 200, 200);
            height: 500px;
            border-radius: 10px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Periodic Table Information Finder</h1>
        <p>Please enter an element symbol to search</p>
        
        <input type="text" id="element1" placeholder="Enter Element Symbol" />

        <br>

        <button py-click = "check_element">
            Check Element
        </button>

        <div class="result"></div>
        <h3> SEARCH RESULT </h3>
        <p><b> Symbol: <span id = "symbol"> </span></p>
        <p><b> Name: <span id = "name"> </span></p>
        <p><b> Atomic Number: <span id = "atomic_number"> </span></p>
        <p><b> Atomic Mass: <span id = "atomic_mass"> </span></p>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
